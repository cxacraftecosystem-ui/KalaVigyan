<text x="364.7" y="52" class="m" fill="#615D7A" font-size="11" font-weight="600" letter-spacing="1.2" text-anchor="end">CRAFTS</text>
<text x="30" y="116" class="d" fill="#1E1B2E" font-size="20" font-weight="700" letter-spacing="-.3">Every craft a monograph</text>
<text x="30" y="146" class="s" fill="#615D7A" font-size="15">Each craft reads as one cited document:</text><text x="30" y="169" class="s" fill="#615D7A" font-size="15">process, chemistry, place, people and</text><text x="30" y="192" class="s" fill="#615D7A" font-size="15">pictures, built from stored facts.</text>
</g>
