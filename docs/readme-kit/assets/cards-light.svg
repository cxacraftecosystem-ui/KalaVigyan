<text x="767.3" y="52" class="m" fill="#615D7A" font-size="11" font-weight="600" letter-spacing="1.2" text-anchor="end">ANSWERS</text>
<text x="432.7" y="116" class="d" fill="#1E1B2E" font-size="20" font-weight="700" letter-spacing="-.3">Every sentence cited</text>
<text x="432.7" y="146" class="s" fill="#615D7A" font-size="15">Ask in any of 13 languages; each</text><text x="432.7" y="169" class="s" fill="#615D7A" font-size="15">sentence links to the quoted passage it</text><text x="432.7" y="192" class="s" fill="#615D7A" font-size="15">rests on, or it is not shown.</text>
</g>
