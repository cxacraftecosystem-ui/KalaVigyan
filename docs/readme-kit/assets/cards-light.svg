<text x="767.3" y="286" class="m" fill="#615D7A" font-size="11" font-weight="600" letter-spacing="1.2" text-anchor="end">LEARNING</text>
<text x="432.7" y="350" class="d" fill="#1E1B2E" font-size="20" font-weight="700" letter-spacing="-.3">Lessons and voice</text>
<text x="432.7" y="380" class="s" fill="#615D7A" font-size="15">Professors make lesson packs and files</text><text x="432.7" y="403" class="s" fill="#615D7A" font-size="15">from explainers, and a finished</text><text x="432.7" y="426" class="s" fill="#615D7A" font-size="15">explainer can be read aloud.</text>
</g>
