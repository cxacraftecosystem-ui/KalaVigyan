global(maxMessageSize="64k")
template(name="KalavigyanLine" type="string" string="%$.kvline%\n")
template(name="KalavigyanFile" type="string" string="/var/log/kalavigyan/%programname%.log")
if $programname == "kv-api" or $programname == "kv-worker" or $programname == "kv-fetcher" or $programname == "kv-contributions" then {
    set $.kvline = ltrim($msg);
    action(type="omfile" dynaFile="KalavigyanFile" template="KalavigyanLine" fileCreateMode="0640")
    stop
}
