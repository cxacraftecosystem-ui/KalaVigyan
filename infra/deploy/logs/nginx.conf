map $uri $kv_logged_path {
    "~^(?<kv_head>/api/(?:shared/answers|shared/lessons|upload-links/slots|upload-links|dataset-uploads|knowledge/pages/previews|knowledge/supplied-sources/slots)/)[^/]+(?<kv_tail>.*)$" "${kv_head}[redacted]${kv_tail}";
    default $uri;
}

log_format kalavigyan escape=json '{"time":"$time_iso8601","method":"$request_method","path":"$kv_logged_path","status":$status,"bytes":$body_bytes_sent,"seconds":$request_time,"upstreamSeconds":"$upstream_response_time","requestId":"$sent_http_x_request_id","agent":"$http_user_agent"}';

access_log /var/log/nginx/kalavigyan-access.log kalavigyan;
