name: MCP client

on:
  workflow_dispatch:
  schedule:
    - cron: "29 2 * * *"
  pull_request:
    paths:
      - ".github/workflows/mcp-client.yml"
      - ".github/actions/release-issue/**"
      - "frontend/e2e/release/**"

permissions:
  contents: read

concurrency:
  group: mcp-client-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  client:
    name: Register, sign in with PKCE, list the tools and call one against production
    if: github.repository == 'cxacraftecosystem-ui/KalaVigyan'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      E2E_BASE_URL: ${{ vars.WEB_ORIGIN || 'https://kalavigyan.vercel.app' }}
      E2E_API_URL: ${{ vars.API_BASE_URL }}
      E2E_REPORT_DIR: mcp-client-run
      E2E_REPORT_TITLE: MCP client
      E2E_WORKERS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm 12
        run: npm install --global npm@12 && npm --version

      - name: Install
        run: npm ci

      - name: Check the account secrets and the API variable
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "$E2E_EMAIL" ] || missing="$missing E2E_EMAIL"
          [ -n "$E2E_PASSWORD" ] || missing="$missing E2E_PASSWORD"
          [ -z "$missing" ] || { echo "::error::Set the repository secrets:$missing (docs/RUNBOOK.md, E2E production run)"; exit 1; }
          [ -n "$E2E_API_URL" ] || { echo "::error::repository variable API_BASE_URL is not set (docs/RUNBOOK.md)"; exit 1; }
          echo "::add-mask::$E2E_PASSWORD"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Drive the MCP client end to end
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: npx playwright test -c e2e/release/release.config.ts --project=mcp-client

      - name: Say what the client did
        if: always()
        run: |
          if [ -f mcp-client-run/summary.md ]; then
            cat mcp-client-run/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No MCP client summary was written; see the step above." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mcp-client-${{ github.run_id }}
          path: frontend/mcp-client-run
          if-no-files-found: warn
          retention-days: 30

  alert:
    name: Open or close the MCP client issue
    needs: client
    if: >-
      !cancelled() && github.repository == 'cxacraftecosystem-ui/KalaVigyan' && github.event_name != 'pull_request' &&
      (needs.client.result == 'success' || needs.client.result == 'failure')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the release issue action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: .github/actions

      - name: Say what the client found
        id: found
        env:
          RESULT: ${{ needs.client.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/mcp-client.md"
          if [ "$RESULT" = failure ]; then
            outcome=failing
            headline="A real MCP client could not register, sign in with PKCE through the consent page, list the tools or call one on production."
            pointer="The run names the step that failed"
          else
            outcome=passing
            headline="A real MCP client registered, signed in with PKCE through the consent page, listed the tools and called one on production."
            pointer="Run"
          fi
          printf '%s\n\n%s: %s\n' "$headline" "$pointer" "$RUN_URL" > "$body"
          {
            echo "outcome=$outcome"
            echo "body=$body"
          } >> "$GITHUB_OUTPUT"

      - name: Track the MCP client issue
        uses: ./.github/actions/release-issue
        with:
          title: The MCP client cannot sign in to production
          outcome: ${{ steps.found.outputs.outcome }}
          body-file: ${{ steps.found.outputs.body }}
