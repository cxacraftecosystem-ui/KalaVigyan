name: Retrieval evaluation

on:
  workflow_dispatch:
    inputs:
      cap:
        description: "Spend at most this many US dollars judging missed generated questions; never above the cap in app/retrieval/miss_judging.py"
        type: string
        default: ""
  schedule:
    - cron: "11 4 * * 1"

permissions:
  contents: read
  id-token: write

concurrency:
  group: retrieval-eval
  cancel-in-progress: false

jobs:
  evaluate:
    name: Score live retrieval on the hand-written and generated questions
    if: github.repository == 'cxacraftecosystem-ui/KalaVigyan'
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    outputs:
      outcome: ${{ steps.floors.outputs.outcome }}
      measures: ${{ steps.floors.outputs.measures }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      BUCKET: ${{ vars.MEDIA_BUCKET }}
      CAP: ${{ inputs.cap }}
    steps:
      - name: Check the repository variables and the input
        run: |
          set -euo pipefail
          for v in AWS_REGION INSTANCE_ID BUCKET; do
            [ -n "${!v}" ] || { echo "::error::repository variable for $v is not set (see docs/RUNBOOK.md)"; exit 1; }
          done
          [[ "$CAP" =~ ^([0-9]+(\.[0-9]+)?)?$ ]] || { echo "::error::cap is a number of US dollars"; exit 1; }
          args=""
          [ -z "$CAP" ] || args="--cap $CAP"
          echo "EVAL_ARGS=$args" >> "$GITHUB_ENV"

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: retrieval-eval-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Ask the questions of the live index on the box and keep the report and the judged revision
        run: |
          set -euo pipefail
          dir="/var/tmp/kv-retrieval-eval/$GITHUB_RUN_ID"
          files="s3://$BUCKET/deploy/logs/retrieval-eval/$GITHUB_RUN_ID/files"
          script=$(cat <<EOF
          set -euo pipefail
          rm -rf $dir
          install -d -o kalavigyan -m 0750 $dir
          cd /opt/kalavigyan/current/backend
          status=0
          runuser -u kalavigyan -- bash -c "set -a; . /opt/kalavigyan/.env; set +a; exec ./.venv/bin/python -m app.scripts.eval_retrieval $EVAL_ARGS --out $dir/retrieval_questions.json" || status=\$?
          if [ -s $dir/retrieval_questions.json ]; then
            aws s3 cp --only-show-errors --region $AWS_REGION $dir/retrieval_questions.json $files/retrieval_questions.json
          fi
          rm -rf $dir
          exit \$status
          EOF
          )
          prefix="deploy/logs/retrieval-eval/$GITHUB_RUN_ID"
          jq -n --arg s "$script" '{commands: [$s], executionTimeout: ["3600"]}' > "$RUNNER_TEMP/params.json"
          cid="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "retrieval evaluation run ${GITHUB_RUN_ID}" \
            --timeout-seconds 300 \
            --parameters "file://$RUNNER_TEMP/params.json" \
            --output-s3-bucket-name "$BUCKET" \
            --output-s3-key-prefix "$prefix" \
            --query Command.CommandId --output text)"
          echo "SSM command $cid"
          deadline=$(( $(date +%s) + 3660 ))
          while :; do
            sleep 15
            status="$(aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)"
            case "$status" in
              Pending|InProgress|Delayed) ;;
              *) break ;;
            esac
            [ "$(date +%s)" -lt "$deadline" ] || { echo "::error::the retrieval evaluation did not finish in 61 minutes"; status=TimedOut; break; }
          done
          echo "status: $status"
          base="$prefix/$cid/$INSTANCE_ID/awsrunShellScript/0.awsrunShellScript"
          out="$RUNNER_TEMP/retrieval-eval"
          mkdir -p "$out"
          aws s3 cp --only-show-errors "s3://$BUCKET/$base/stdout" "$out/stdout.txt" \
            || aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text > "$out/stdout.txt"
          echo "::group::box stderr"
          aws s3 cp --only-show-errors "s3://$BUCKET/$base/stderr" - 2>/dev/null \
            || aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text
          echo "::endgroup::"
          aws s3 cp --only-show-errors "$files/retrieval_questions.json" "$out/retrieval_questions.json" 2>/dev/null \
            || echo "no judged revision of the generated questions was written"
          if [ -s "$out/stdout.txt" ] && tail -n 1 "$out/stdout.txt" | jq -e . > "$out/report.json" 2> /dev/null; then
            jq '{ok, error, floors, belowFloor, warnings, generatedRevision, judgeStopped, searchSpentUsd, judgeSpentUsd, judged: ((.judged // []) | length)}' "$out/report.json"
          else
            echo "::warning::the box printed no JSON report"
          fi
          [ "$status" = Success ] || { echo "::error::the retrieval evaluation ended $status; the report, when written, is kept as the retrieval-eval artifact"; exit 1; }

      - name: Compare with the floors and summarise
        id: floors
        if: always()
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/retrieval-eval/report.json"
          if [ ! -s "$report" ] || ! jq -e '.ok == true' "$report" > /dev/null; then
            outcome=unknown
            measures="the evaluation wrote no report"
          else
            measures="$(jq -r '[.floors[] | "\(.measure) \(.value // "none") (floor \(.floor))"] | join(", ")' "$report")"
            if jq -e '.belowFloor == true' "$report" > /dev/null; then outcome=failing
            elif jq -e '(.warnings // []) | length > 0' "$report" > /dev/null; then outcome=warned
            else outcome=passing; fi
            jq -r '(.warnings // [])[] | "::warning::\(.)"' "$report"
            {
              echo "### Retrieval evaluation"
              echo ""
              echo "Floors: ${measures:-none set}. Asking the questions spent \$$(jq -r '.searchSpentUsd // "0"' "$report") (query embeddings and one rerank per question). Judged $(jq '(.judged // []) | length' "$report") missed generated questions for \$$(jq -r '.judgeSpentUsd // "0"' "$report")."
              echo ""
              jq -r '(.warnings // [])[] | "- \(.)"' "$report"
              echo ""
              echo "| Set | Order | Questions | Recall at 5 | Mean reciprocal rank | Recall at 20 | Fell back to fused |"
              echo "|---|---|---|---|---|---|---|"
              jq -r '.sets | to_entries[] | .key as $set | .value | to_entries[] | "| \($set) | \(.key) | \(.value.questions) | \(.value.recallAt5) | \(.value.meanReciprocalRank) | \(.value.recallAt20) | \((.value.fellBackToFused // []) | length) |"' "$report"
              echo ""
              echo "| Set | Field | Questions | Reranked recall at 5 | Reranked mean reciprocal rank | Fused recall at 5 | Fused mean reciprocal rank |"
              echo "|---|---|---|---|---|---|---|"
              jq -r '.sets | to_entries[] | .key as $set | .value.reranked.byField as $r | .value.fused.byField as $f | $r | keys[] | "| \($set) | \(.) | \($r[.].questions) | \($r[.].recallAt5) | \($r[.].meanReciprocalRank) | \($f[.].recallAt5 // "none") | \($f[.].meanReciprocalRank // "none") |"' "$report"
              echo ""
              echo "| Hand-written question | Missed in the reranked top 5 | Missed in the fused top 5 |"
              echo "|---|---|---|"
              jq -r '(.sets.handWritten.reranked.misses // {}) as $r | (.sets.handWritten.fused.misses // {}) as $f | ($r + $f) | keys[] | "| \(.) | \(($r[.] // []) | join(", ")) | \(($f[.] // []) | join(", ")) |"' "$report"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          echo "measures=$measures" >> "$GITHUB_OUTPUT"
          echo "retrieval floors: $outcome ($measures)"

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: retrieval-eval-${{ github.run_id }}
          path: ${{ runner.temp }}/retrieval-eval/
          if-no-files-found: warn
          retention-days: 90

      - name: Stop when a floor is broken
        if: steps.floors.outputs.outcome == 'failing'
        env:
          MEASURES: ${{ steps.floors.outputs.measures }}
        run: |
          echo "::error::retrieval fell below its floor: $MEASURES (backend/app/data/eval/floors.json)"
          exit 1

  alert:
    name: Open or close the retrieval floor issue
    needs: evaluate
    if: >-
      !cancelled() && github.repository == 'cxacraftecosystem-ui/KalaVigyan' &&
      (needs.evaluate.result == 'success' || needs.evaluate.result == 'failure')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the release issue action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions

      - name: Say what the evaluation found
        id: found
        env:
          OUTCOME: ${{ needs.evaluate.outputs.outcome }}
          MEASURES: ${{ needs.evaluate.outputs.measures }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/retrieval-floor.md"
          case "${OUTCOME:-unknown}" in
            failing) headline="Live retrieval fell below its floor: ${MEASURES}." ;;
            passing) headline="Live retrieval is at or above its floors again: ${MEASURES}." ;;
            warned) headline="The rerank failed during the retrieval evaluation, so only the fused floors were compared where it did: ${MEASURES}." ;;
            *) headline="The retrieval evaluation wrote no report, so the floors were not compared." ;;
          esac
          printf '%s\n\nThe floors are in backend/app/data/eval/floors.json (decision 0126). Run: %s\n' "$headline" "$RUN_URL" > "$body"
          {
            echo "outcome=${OUTCOME:-unknown}"
            echo "body=$body"
          } >> "$GITHUB_OUTPUT"

      - name: Track the retrieval floor issue
        uses: ./.github/actions/release-issue
        with:
          title: Retrieval fell below its floor
          outcome: ${{ steps.found.outputs.outcome }}
          body-file: ${{ steps.found.outputs.body }}
