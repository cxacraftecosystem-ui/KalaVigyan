name: Backend checks

on:
  pull_request:
    paths:
      - "backend/**"
      - "shared/**"
      - "infra/deploy/**"
      - "tools/**"
      - ".github/workflows/backend-checks.yml"
  push:
    branches: [main, "round[0-9]", "round[0-9][0-9]"]
    paths:
      - "backend/**"
      - "shared/**"
      - "infra/deploy/**"
      - ".github/workflows/backend-checks.yml"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.15"
  UV_LOCKED: "1"

jobs:
  lint-and-unit:
    name: Lint and unit tests
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Unit tests
        run: uv run pytest -q
      - name: Tools lint and tests (hygiene, curation)
        working-directory: .
        run: |
          backend/.venv/bin/python -m ruff check tools
          backend/.venv/bin/python -m ruff format --check tools
          backend/.venv/bin/python -m pytest -q tools/tests
      - name: Hygiene check
        working-directory: .
        run: backend/.venv/bin/python tools/hygiene_check.py
      - name: Curation check
        working-directory: .
        run: backend/.venv/bin/python tools/curation/check.py --check-index
      - name: Migration renders offline
        env:
          DATABASE_URL: postgresql://kalavigyan:kalavigyan@localhost:5432/kalavigyan_test
          MASTER_ADMIN_EMAIL: owner@example.com
        run: |
          export JWT_SECRET="$(openssl rand -base64 48)"
          echo "::add-mask::$JWT_SECRET"
          uv run alembic upgrade head --sql > /dev/null

  database:
    name: Migrations and database tests
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    needs: lint-and-unit
    services:
      postgres:
        image: postgis/postgis:17-3.7
        env:
          POSTGRES_USER: kalavigyan
          POSTGRES_PASSWORD: kalavigyan
          POSTGRES_DB: kalavigyan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kalavigyan -d kalavigyan_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://kalavigyan:kalavigyan@localhost:5432/kalavigyan_test
      MASTER_ADMIN_EMAIL: owner@example.com
      APP_ENV: test
      RUN_DB_TESTS: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Add pgvector to the PostGIS service
        working-directory: .
        run: |
          docker exec "${{ job.services.postgres.id }}" bash -c \
            "apt-get update -qq && apt-get install -y -qq --no-install-recommends postgresql-17-pgvector"
          docker exec "${{ job.services.postgres.id }}" psql -U kalavigyan -d kalavigyan_test -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS vector" -c "CREATE EXTENSION IF NOT EXISTS postgis" \
            -c "SELECT extname, extversion FROM pg_extension ORDER BY extname"
      - name: Generate per-run keys
        run: |
          jwt="$(openssl rand -base64 48 | tr -d '\n')"
          totp="$(openssl rand -base64 32 | tr -d '\n')"
          fernet="$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '\n')"
          echo "::add-mask::$jwt"
          echo "::add-mask::$totp"
          echo "::add-mask::$fernet"
          {
            echo "JWT_SECRET=$jwt"
            echo "TWO_FACTOR_ENCRYPTION_KEY=$totp"
            echo "SECRETS_ENCRYPTION_KEY=$fernet"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install
        run: uv sync --locked
      - name: Alembic upgrade head
        run: uv run alembic upgrade head
      - name: Alembic downgrade and upgrade again
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Seed the craft catalogue
        run: uv run python -m app.scripts.seed_crafts
      - name: Seed the claims
        run: uv run python -m app.scripts.seed_claims
      - name: Seed states and districts
        run: uv run python -m app.scripts.seed_districts
      - name: Database tests
        run: uv run pytest -q -m db tests/db
      - name: Import the curated dossiers as the deploy does
        run: uv run python -m app.scripts.import_curation
      - name: The release before reads and writes the migrated database
        env:
          PREVIOUS_REF: ${{ github.event_name == 'push' && github.ref_name == 'main' && github.event.before || 'main' }}
        run: |
          git fetch --no-tags --depth=1 origin "$PREVIOUS_REF"
          git worktree add --detach "$RUNNER_TEMP/previous-release" FETCH_HEAD
          PREVIOUS_RELEASE_BACKEND="$RUNNER_TEMP/previous-release/backend" uv run pytest -q -m db tests/db/test_previous_release_db.py -k release_before
