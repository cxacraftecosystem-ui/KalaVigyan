name: Craft data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"
  push:
    paths:
      - "etl/crafts/**"
      - "backend/app/data/**"
      - "shared/craft-master.sha1"
      - ".github/workflows/craft-data.yml"
  pull_request:
    paths:
      - "etl/crafts/**"
      - "backend/app/data/**"
      - "shared/craft-master.sha1"
      - ".github/workflows/craft-data.yml"

permissions:
  contents: read

concurrency:
  group: craft-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Craft data checks
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: etl/crafts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install httpx anyascii indic-transliteration rapidfuzz pytest ruff
      - name: Master list matches its recorded sha1
        working-directory: .
        run: sha1sum -c shared/craft-master.sha1
      - name: Lint
        run: ruff check . && ruff format --check . && ruff check ../../backend/app/data
      - name: Tests
        run: python -m pytest -q tests

  regenerate:
    name: Regenerate Wikidata links and aliases
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: checks
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: etl/crafts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install httpx anyascii indic-transliteration rapidfuzz
      - name: Keep the committed files for comparison
        run: |
          mkdir -p "$RUNNER_TEMP/before"
          cp ../../backend/app/data/craft_wikidata.json ../../backend/app/data/craft_aliases.json "$RUNNER_TEMP/before/"
      - name: Link crafts to Wikidata
        run: python wikidata_link.py --no-cache
      - name: Merge aliases
        run: python aliases.py
      - name: Summarise changes
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          before = os.environ["RUNNER_TEMP"] + "/before/"
          old = json.load(open(before + "craft_wikidata.json", encoding="utf-8"))
          new = json.load(open("../../backend/app/data/craft_wikidata.json", encoding="utf-8"))
          prev = {r["slug"]: r for r in old["crafts"]}
          changed = [r["slug"] for r in new["crafts"] if prev.get(r["slug"], {}).get("status") != r["status"]]
          print("## Craft data")
          print(f"Before: {old['summary']}")
          print(f"After: {new['summary']}")
          print(f"Crafts whose status changed: {len(changed)}")
          for slug in changed[:50]:
              print(f"- {slug}: {prev.get(slug, {}).get('status')} -> {next(r['status'] for r in new['crafts'] if r['slug'] == slug)}")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: craft-data-${{ github.run_number }}
          path: |
            backend/app/data/craft_wikidata.json
            backend/app/data/craft_aliases.json
          if-no-files-found: error
          retention-days: 30
