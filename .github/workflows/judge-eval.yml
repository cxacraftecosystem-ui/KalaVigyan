name: Gate judge evaluation

on:
  workflow_dispatch:
  schedule:
    - cron: "37 1 * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: judge-eval
  cancel-in-progress: false

jobs:
  evaluate:
    name: Score the live duplicate and novelty judges on the labelled cases
    if: github.repository == 'cxacraftecosystem-ui/KalaVigyan'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      BUCKET: ${{ vars.MEDIA_BUCKET }}
    steps:
      - name: Check the repository variables
        run: |
          set -euo pipefail
          for v in AWS_REGION INSTANCE_ID BUCKET; do
            [ -n "${!v}" ] || { echo "::error::repository variable for $v is not set (see docs/RUNBOOK.md)"; exit 1; }
          done

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: judge-eval-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Ask the live judges on the box
        run: |
          set -euo pipefail
          script=$(cat <<'EOF'
          set -euo pipefail
          cd /opt/kalavigyan/current/backend
          runuser -u kalavigyan -- bash -c "set -a; . /opt/kalavigyan/.env; set +a; exec ./.venv/bin/python -m app.scripts.eval_judges"
          EOF
          )
          prefix="deploy/logs/judge-eval/$GITHUB_RUN_ID"
          jq -n --arg s "$script" '{commands: [$s], executionTimeout: ["900"]}' > "$RUNNER_TEMP/params.json"
          cid="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "gate judge evaluation ${GITHUB_RUN_ID}" \
            --timeout-seconds 300 \
            --parameters "file://$RUNNER_TEMP/params.json" \
            --output-s3-bucket-name "$BUCKET" \
            --output-s3-key-prefix "$prefix" \
            --query Command.CommandId --output text)"
          echo "SSM command $cid"
          deadline=$(( $(date +%s) + 960 ))
          while :; do
            sleep 15
            status="$(aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)"
            case "$status" in
              Pending|InProgress|Delayed) ;;
              *) break ;;
            esac
            [ "$(date +%s)" -lt "$deadline" ] || { echo "::error::the judge evaluation did not finish in 16 minutes"; status=TimedOut; break; }
          done
          echo "status: $status"
          base="$prefix/$cid/$INSTANCE_ID/awsrunShellScript/0.awsrunShellScript"
          out="$RUNNER_TEMP/judge-eval"
          mkdir -p "$out"
          aws s3 cp --only-show-errors "s3://$BUCKET/$base/stdout" "$out/stdout.txt" \
            || aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text > "$out/stdout.txt"
          if [ -s "$out/stdout.txt" ] && tail -n 1 "$out/stdout.txt" | jq -e . > "$out/report.json" 2> /dev/null; then
            {
              echo "### Gate judge evaluation"
              echo ""
              echo "| Measure | Value | Floor | Held |"
              echo "|---|---|---|---|"
              jq -r '(.floors // [])[] | "| \(.measure) | \(.value // "none") | \(.floor) | \(.held) |"' "$out/report.json"
              echo ""
              echo "| Case | Label | Judged |"
              echo "|---|---|---|"
              jq -r '(.wrong // [])[] | "| \(.key) | \(.label) | \(.judged) |"' "$out/report.json"
            } >> "$GITHUB_STEP_SUMMARY"
            jq '{ok, error, belowFloor, models, measures}' "$out/report.json"
          else
            echo "::warning::the box printed no JSON report"
          fi
          [ "$status" = Success ] || { echo "::error::the judge evaluation ended $status: a judge fell below its floor (backend/app/data/eval/judge_cases.json) or could not answer"; exit 1; }

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: judge-eval-${{ github.run_id }}
          path: ${{ runner.temp }}/judge-eval/
          if-no-files-found: warn
          retention-days: 90
