name: Re-embed knowledge

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: "Embed for at most this many seconds (60 to 3300); the runs repeat until every vector is current or the time is spent"
        type: string
        default: "1800"

permissions:
  contents: read
  id-token: write

concurrency:
  group: embed-knowledge
  cancel-in-progress: false

jobs:
  embed:
    name: Renew every claim, passage and craft vector on the box
    if: github.repository == 'cxacraftecosystem-ui/KalaVigyan'
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      BUCKET: ${{ vars.MEDIA_BUCKET }}
      SECONDS_BUDGET: ${{ inputs.seconds }}
    steps:
      - name: Check the repository variables and the input
        run: |
          set -euo pipefail
          for v in AWS_REGION INSTANCE_ID BUCKET; do
            [ -n "${!v}" ] || { echo "::error::repository variable for $v is not set (see docs/RUNBOOK.md)"; exit 1; }
          done
          [[ "$SECONDS_BUDGET" =~ ^[0-9]+$ ]] || { echo "::error::seconds is a whole number"; exit 1; }
          [ "$SECONDS_BUDGET" -ge 60 ] && [ "$SECONDS_BUDGET" -le 3300 ] || { echo "::error::seconds is between 60 and 3300"; exit 1; }

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: embed-knowledge-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Embed on the box until every vector is current or the time is spent
        run: |
          set -euo pipefail
          script=$(cat <<EOF
          set -euo pipefail
          cd /opt/kalavigyan/current/backend
          run() { runuser -u kalavigyan -- bash -c "set -a; . /opt/kalavigyan/.env; set +a; exec ./.venv/bin/python -m app.scripts.\$1 --seconds \$2"; }
          end=\$(( \$(date +%s) + $SECONDS_BUDGET ))
          run embed_craft_descriptors 300
          while :; do
            left=\$(( end - \$(date +%s) ))
            [ "\$left" -gt 30 ] || { echo "the time is spent; the daily run embeds the rest"; break; }
            report=\$(run embed_knowledge \$left | tail -n 1 || true)
            echo "\$report"
            case "\$report" in
              *'"complete": true'*) echo "every vector is current"; break ;;
              *'"complete": false'*) ;;
              *) echo "the embedding run failed or printed no report"; exit 1 ;;
            esac
          done
          EOF
          )
          prefix="deploy/logs/embed-knowledge/$GITHUB_RUN_ID"
          jq -n --arg s "$script" '{commands: [$s], executionTimeout: ["3600"]}' > "$RUNNER_TEMP/params.json"
          cid="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "re-embedding run ${GITHUB_RUN_ID}" \
            --timeout-seconds 300 \
            --parameters "file://$RUNNER_TEMP/params.json" \
            --output-s3-bucket-name "$BUCKET" \
            --output-s3-key-prefix "$prefix" \
            --query Command.CommandId --output text)"
          echo "SSM command $cid"
          deadline=$(( $(date +%s) + 3660 ))
          while :; do
            sleep 15
            status="$(aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)"
            case "$status" in
              Pending|InProgress|Delayed) ;;
              *) break ;;
            esac
            [ "$(date +%s)" -lt "$deadline" ] || { echo "::error::the re-embedding did not finish in 61 minutes"; status=TimedOut; break; }
          done
          echo "status: $status"
          base="$prefix/$cid/$INSTANCE_ID/awsrunShellScript/0.awsrunShellScript"
          echo "::group::box stdout"
          aws s3 cp --only-show-errors "s3://$BUCKET/$base/stdout" - 2>/dev/null \
            || aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          echo "::endgroup::"
          echo "::group::box stderr"
          aws s3 cp --only-show-errors "s3://$BUCKET/$base/stderr" - 2>/dev/null \
            || aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text
          echo "::endgroup::"
          [ "$status" = Success ] || { echo "::error::the re-embedding ended $status; the box log is in s3://$BUCKET/$prefix"; exit 1; }
