name: Release gate lockfile

on:
  push:
    branches: [round7-release-gate]
    paths:
      - ".github/workflows/release-lockfile.yml"

permissions:
  contents: read

jobs:
  lock:
    name: Resolve the release gate's pinned devDependencies with npm 12
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: frontend/package.json

      - name: Install npm 12
        run: npm install --global npm@12 && npm --version

      - name: Resolve the lockfile without installing
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Say what changed
        run: git diff --stat -- package-lock.json

      - name: Audit the resolved lockfile
        continue-on-error: true
        run: node scripts/audit.mjs

      - name: Keep the lockfile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-lockfile
          path: frontend/package-lock.json
          retention-days: 1
