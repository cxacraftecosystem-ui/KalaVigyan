name: Generated retrieval questions

on:
  workflow_dispatch:
    inputs:
      cap:
        description: "Spend at most this many US dollars writing questions (empty for the script's default, 3)"
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: eval-questions
  cancel-in-progress: false

jobs:
  generate:
    name: Write a question for each sampled published fact on the box and keep the set
    if: github.repository == 'cxacraftecosystem-ui/KalaVigyan'
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      BUCKET: ${{ vars.MEDIA_BUCKET }}
      CAP: ${{ inputs.cap }}
    steps:
      - name: Check the repository variables and the input
        run: |
          set -euo pipefail
          for v in AWS_REGION INSTANCE_ID BUCKET; do
            [ -n "${!v}" ] || { echo "::error::repository variable for $v is not set (see docs/RUNBOOK.md)"; exit 1; }
          done
          [[ "$CAP" =~ ^([0-9]+(\.[0-9]+)?)?$ ]] || { echo "::error::cap is a number of US dollars"; exit 1; }
          args=""
          [ -z "$CAP" ] || args="--cap $CAP"
          echo "GENERATE_ARGS=$args" >> "$GITHUB_ENV"

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: eval-questions-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Generate the questions on the box and fetch the set
        run: |
          set -euo pipefail
          dir="/var/tmp/kv-eval-questions/$GITHUB_RUN_ID"
          files="s3://$BUCKET/deploy/logs/eval-questions/$GITHUB_RUN_ID/files"
          script=$(cat <<EOF
          set -euo pipefail
          rm -rf $dir
          install -d -o kalavigyan -m 0750 $dir
          cd /opt/kalavigyan/current/backend
          status=0
          runuser -u kalavigyan -- bash -c "set -a; . /opt/kalavigyan/.env; set +a; exec ./.venv/bin/python -m app.scripts.generate_eval_questions $GENERATE_ARGS --out $dir/retrieval_questions.json" || status=\$?
          if [ -s $dir/retrieval_questions.json ]; then
            aws s3 cp --only-show-errors --region $AWS_REGION $dir/retrieval_questions.json $files/retrieval_questions.json
          fi
          rm -rf $dir
          exit \$status
          EOF
          )
          prefix="deploy/logs/eval-questions/$GITHUB_RUN_ID"
          jq -n --arg s "$script" '{commands: [$s], executionTimeout: ["7800"]}' > "$RUNNER_TEMP/params.json"
          cid="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "generated retrieval questions run ${GITHUB_RUN_ID}" \
            --timeout-seconds 300 \
            --parameters "file://$RUNNER_TEMP/params.json" \
            --output-s3-bucket-name "$BUCKET" \
            --output-s3-key-prefix "$prefix" \
            --query Command.CommandId --output text)"
          echo "SSM command $cid"
          deadline=$(( $(date +%s) + 7860 ))
          while :; do
            sleep 30
            status="$(aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)"
            case "$status" in
              Pending|InProgress|Delayed) ;;
              *) break ;;
            esac
            [ "$(date +%s)" -lt "$deadline" ] || { echo "::error::the question generation did not finish in 131 minutes"; status=TimedOut; break; }
          done
          echo "status: $status"
          base="$prefix/$cid/$INSTANCE_ID/awsrunShellScript/0.awsrunShellScript"
          out="$RUNNER_TEMP/eval-questions"
          mkdir -p "$out"
          aws s3 cp --only-show-errors "s3://$BUCKET/$base/stdout" "$out/stdout.txt" \
            || aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text > "$out/stdout.txt"
          echo "::group::box stderr"
          aws s3 cp --only-show-errors "s3://$BUCKET/$base/stderr" - 2>/dev/null \
            || aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text
          echo "::endgroup::"
          aws s3 cp --only-show-errors "$files/retrieval_questions.json" "$out/retrieval_questions.json" 2>/dev/null \
            || echo "::warning::the box wrote no generated set"
          if [ -s "$out/stdout.txt" ] && tail -n 1 "$out/stdout.txt" | jq -e . > "$out/report.json" 2> /dev/null; then
            jq . "$out/report.json"
            {
              echo "### Generated retrieval questions"
              echo ""
              jq -r '"Revision \(.revision // "none"): \(.questions // 0) questions over \(.crafts // 0) crafts from \(.facts // 0) sampled facts (\(.reused // 0) kept from the last set), \(.batches // 0) writer calls, $\(.spentUsd // "0") of $\(.capUsd // "0")\(if .stopped then ", stopped: \(.stopped)" else "" end)\(if .ok then "" else ", error: \(.error)" end)"' "$out/report.json"
              echo ""
              echo "| Dropped because | Questions |"
              echo "|---|---|"
              jq -r '(.dropped // {}) | to_entries[] | "| \(.key) | \(.value) |"' "$out/report.json"
              echo ""
              echo "Commit the artifact's retrieval_questions.json as backend/app/data/eval/generated/retrieval_questions.json."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::the box printed no JSON report"
          fi
          [ "$status" = Success ] || { echo "::error::the question generation ended $status; the set, when written, is kept as the eval-questions artifact"; exit 1; }

      - name: Keep the set
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-questions-${{ github.run_id }}
          path: ${{ runner.temp }}/eval-questions/
          if-no-files-found: warn
          retention-days: 90
