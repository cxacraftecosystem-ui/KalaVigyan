name: Nightly upkeep

on:
  schedule:
    - cron: "45 23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what the upkeep would do, write nothing and refresh no page"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: nightly-upkeep
  cancel-in-progress: false

jobs:
  upkeep:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      BUCKET: ${{ vars.MEDIA_BUCKET }}
      UPKEEP_ARGS: ${{ inputs.dry_run && '--dry-run' || '' }}
    steps:
      - name: Check the repository variables
        run: |
          set -euo pipefail
          for v in AWS_REGION INSTANCE_ID BUCKET; do
            [ -n "${!v}" ] || { echo "::error::repository variable for $v is not set (see docs/RUNBOOK.md)"; exit 1; }
          done

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: nightly-upkeep-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Re-verify quotes, archive sources, sweep orphaned concepts, rebuild stale pages and refresh only the changed ones on the box
        run: |
          set -euo pipefail
          case "$UPKEEP_ARGS" in ""|--dry-run) ;; *) echo "::error::unexpected upkeep arguments"; exit 1 ;; esac
          script=$(cat <<EOF
          set -euo pipefail
          cd /opt/kalavigyan/current/backend
          runuser -u kalavigyan -- bash -c "set -a; . /opt/kalavigyan/.env; set +a; exec ./.venv/bin/python -m app.scripts.nightly_upkeep $UPKEEP_ARGS"
          EOF
          )
          prefix="deploy/logs/nightly-upkeep/$GITHUB_RUN_ID"
          jq -n --arg s "$script" '{commands: [$s], executionTimeout: ["3000"]}' > "$RUNNER_TEMP/params.json"
          cid="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "nightly upkeep run ${GITHUB_RUN_ID}" \
            --timeout-seconds 300 \
            --parameters "file://$RUNNER_TEMP/params.json" \
            --output-s3-bucket-name "$BUCKET" \
            --output-s3-key-prefix "$prefix" \
            --query Command.CommandId --output text)"
          echo "SSM command $cid"
          deadline=$(( $(date +%s) + 3120 ))
          while :; do
            sleep 15
            status="$(aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)"
            case "$status" in
              Pending|InProgress|Delayed) ;;
              *) break ;;
            esac
            [ "$(date +%s)" -lt "$deadline" ] || { echo "::error::the nightly upkeep did not finish in 52 minutes"; status=TimedOut; break; }
          done
          echo "status: $status"
          base="$prefix/$cid/$INSTANCE_ID/awsrunShellScript/0.awsrunShellScript"
          for stream in stdout stderr; do
            echo "::group::box $stream"
            aws s3 cp --only-show-errors "s3://$BUCKET/$base/$stream" - 2>/dev/null \
              || aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE_ID" \
                   --query "$( [ "$stream" = stdout ] && echo StandardOutputContent || echo StandardErrorContent )" --output text
            echo "::endgroup::"
          done
          [ "$status" = Success ] || { echo "::error::nightly upkeep ended $status; the JSON report above counts quotes, archives, orphans, pages and the refresh (docs/contracts/nightly-upkeep.md)"; exit 1; }
