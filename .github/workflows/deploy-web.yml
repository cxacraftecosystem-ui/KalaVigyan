name: Deploy web app

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "!frontend/e2e/**"
      - ".github/actions/build-web-app/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: deploy-web-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Build the web app once the API it needs is live
        id: build
        uses: ./.github/actions/build-web-app
        with:
          api-base-url: ${{ vars.API_BASE_URL }}

      - name: Hand the web build to Deploy backend
        if: steps.build.outputs.api == 'waiting'
        run: echo "::notice::the API that main's head needs is not live yet; the Deploy backend that ships it builds the web app, and its own post-deploy check reads the pages"
