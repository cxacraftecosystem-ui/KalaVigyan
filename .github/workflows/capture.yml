name: Capture screens

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: The site to capture (empty captures production)
        required: false
        default: ""
      paths:
        description: Comma-separated paths to capture at 360, 834, 1440 and 1920 in light and dark, and at 360 in high contrast light and dark (empty captures the default set)
        required: false
        default: ""
      audit:
        description: Also run Lighthouse and axe on those paths at 360 and 1440 against the budgets
        type: boolean
        default: true
      figure:
        description: Instead, capture Kutch Ajrakh's ground figure from the React page, rebuild the approved page with it and check the two read and measure alike
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  capture:
    name: Capture pages and the master board at 360, 834, 1440 and 1920 in light and dark, and in high contrast at 360
    if: github.repository == 'cxacraftecosystem-ui/KalaVigyan' && !inputs.figure
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    concurrency:
      group: capture-screens
      cancel-in-progress: false
    defaults:
      run:
        working-directory: frontend
    env:
      E2E_CAPTURE: "1"
      E2E_BASE_URL: ${{ inputs.base_url || vars.WEB_ORIGIN || 'https://kalavigyan.vercel.app' }}
      E2E_SCREEN_PATHS: ${{ inputs.paths }}
      E2E_VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      E2E_REPORT_DIR: capture-run
      E2E_WORKERS: "3"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm 12
        run: npm install --global npm@12 && npm --version

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture
        run: npx playwright test --project='capture-*'

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capture-${{ github.run_id }}
          path: frontend/capture-run
          if-no-files-found: warn
          retention-days: 30

  audit:
    name: Lighthouse and axe at 360 and 1440 within the budgets
    if: github.repository == 'cxacraftecosystem-ui/KalaVigyan' && inputs.audit && !inputs.figure
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    env:
      E2E_BASE_URL: ${{ inputs.base_url || vars.WEB_ORIGIN || 'https://kalavigyan.vercel.app' }}
      E2E_SCREEN_PATHS: ${{ inputs.paths }}
      E2E_VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      E2E_REPORT_DIR: audit-run
      E2E_REPORT_TITLE: Lighthouse and axe
      E2E_WORKERS: "3"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm 12
        run: npm install --global npm@12 && npm --version

      - name: Install
        run: npm ci

      - name: Install Chromium
        id: browser
        run: npx playwright install --with-deps chromium

      - name: axe at 360 and 1440 in light and dark
        run: npx playwright test -c e2e/release/release.config.ts --project='axe-*'

      - name: Lighthouse at 360 and 1440, one page at a time
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: npx playwright test -c e2e/release/release.config.ts --project=lighthouse --workers=1

      - name: Say what was measured
        if: always()
        run: |
          if [ -f audit-run/summary.md ]; then
            cat audit-run/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No audit summary was written; see the steps above." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audit-${{ github.run_id }}
          path: frontend/audit-run
          if-no-files-found: warn
          retention-days: 30

  figure:
    name: Capture Kutch Ajrakh's ground figure into the approved page and check it reads and measures as the React page
    if: github.repository == 'cxacraftecosystem-ui/KalaVigyan' && inputs.figure
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    concurrency:
      group: capture-figure
      cancel-in-progress: false
    defaults:
      run:
        working-directory: frontend
    env:
      E2E_FIGURE: "1"
      E2E_BASE_URL: ${{ inputs.base_url || vars.WEB_ORIGIN || 'https://kalavigyan.vercel.app' }}
      E2E_VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      E2E_REPORT_DIR: figure-run
      E2E_FIGURE_PAGE: public/monographs/kutch-ajrakh/index.html
      E2E_WORKERS: "3"
      UV_LOCKED: "1"
      FIGURE_FRAGMENT: ../backend/app/data/monographs/Kutch-Ajrakh/fragments/kutch-ajrakh__geography__why-here.html
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm 12
        run: npm install --global npm@12 && npm --version

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install the backend
        working-directory: backend
        run: uv sync --locked

      - name: Capture the figure at 1440 in light
        env:
          E2E_FIGURE_STEP: capture
        run: npx playwright test --project=figure-desktop-light

      - name: Place the fragment
        run: cp figure-run/fragment.html "$FIGURE_FRAGMENT"

      - name: Build the approved page, the golden document, the component homes and the kit defs
        working-directory: backend
        run: |
          uv run python -m app.scripts.build_monograph
          uv run python -m app.scripts.build_monograph --document Kutch-Ajrakh --out ../shared/monograph.document.golden.json
          uv run python -m app.scripts.write_component_homes
          uv run python -m app.scripts.build_monograph --check
          uv run python -m app.scripts.write_component_homes --check

      - name: Check the rebuilt page against the React page at 360, 834 and 1440 in light and dark
        env:
          E2E_FIGURE_STEP: check
        run: npx playwright test --project='figure-*'

      - name: Gather the rebuilt files
        if: always()
        working-directory: .
        run: |
          mkdir -p frontend/figure-run/files
          git status --porcelain --untracked-files=all -- backend/app/data/monographs frontend/public/monographs frontend/lib/componentHomes.ts frontend/generated shared > frontend/figure-run/changed.txt
          cat frontend/figure-run/changed.txt
          cut -c4- frontend/figure-run/changed.txt | while read -r path; do
            mkdir -p "frontend/figure-run/files/$(dirname "$path")" && cp "$path" "frontend/figure-run/files/$path"
          done

      - name: Keep the figure, the rebuilt page and the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: figure-${{ github.run_id }}
          path: frontend/figure-run
          if-no-files-found: warn
          retention-days: 30
