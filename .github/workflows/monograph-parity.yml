name: Monograph parity

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: The site to compare on (empty compares production)
        required: false
        default: ""
      check:
        description: What to compare (all, monograph for the Kutch Ajrakh page, borrowed for its components on the pages that borrow them)
        type: choice
        options: [all, monograph, borrowed]
        default: all
  workflow_run:
    workflows: [Deploy web app]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: monograph-parity
  cancel-in-progress: false

jobs:
  parity:
    name: Compare the React monograph and every borrowed component with the approved page
    if: >-
      github.repository == 'cxacraftecosystem-ui/KalaVigyan' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    env:
      E2E_PARITY: "1"
      E2E_PARITY_CHECK: ${{ inputs.check || 'borrowed' }}
      E2E_BASE_URL: ${{ inputs.base_url || vars.WEB_ORIGIN || 'https://kalavigyan.vercel.app' }}
      E2E_VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      E2E_REPORT_DIR: parity-run
      E2E_WORKERS: "3"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm 12
        run: npm install --global npm@12 && npm --version

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Compare at 360, 834, 1440 and 1920 in light and dark
        run: npx playwright test --project='parity-*'

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: monograph-parity-${{ github.run_id }}
          path: frontend/parity-run
          if-no-files-found: warn
          retention-days: 30
