name: Monograph parity

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: The site to compare on (empty compares production)
        required: false
        default: ""
      check:
        description: What to compare (all, monograph for the Kutch Ajrakh page, borrowed for its components on the pages that borrow them)
        type: choice
        options: [all, monograph, borrowed]
        default: all
  workflow_run:
    workflows: [Deploy web app, Deploy backend]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: monograph-parity
  cancel-in-progress: false

jobs:
  served:
    name: Wait until production serves the deployed commit
    if: >-
      github.repository == 'cxacraftecosystem-ui/KalaVigyan' &&
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
    outputs:
      built: ${{ steps.await.outputs.built }}
      reached: ${{ steps.await.outputs.reached }}
    steps:
      - name: Check out the repository with its history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Wait for the build of the deployed commit
        id: await
        uses: ./.github/actions/await-build
        with:
          commit: ${{ github.event.workflow_run.head_sha }}
          trigger-run: ${{ github.event.workflow_run.id }}
          web-origin: ${{ vars.WEB_ORIGIN || 'https://kalavigyan.vercel.app' }}
          wait-seconds: "2400"
          token: ${{ github.token }}

      - name: Say what will be compared
        env:
          BUILT: ${{ steps.await.outputs.built }}
          REACHED: ${{ steps.await.outputs.reached }}
          HAVE: ${{ steps.await.outputs.served }}
          WAITED: ${{ steps.await.outputs.waited }}
          EXPECTED: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          case "$BUILT:$REACHED" in
            success:yes) echo "production serves $HAVE, so its parity is compared" ;;
            none:*) echo "::notice::this deploy started no web build, so parity waits for the deploy that does" ;;
            failure:*) echo "::error::the deploy hook did not start the build of ${EXPECTED:0:12}, so parity was not compared against an older build"; exit 1 ;;
            *) echo "::error::production still serves ${HAVE:-no commit}, not ${EXPECTED:0:12} or a later commit of main, after waiting ${WAITED:-0}s: its Vercel build failed or never finished, so parity was not compared against an older build"; exit 1 ;;
          esac

  parity:
    name: Compare the React monograph and every borrowed component with the approved page
    needs: served
    if: >-
      !cancelled() && github.repository == 'cxacraftecosystem-ui/KalaVigyan' &&
      (github.event_name == 'workflow_dispatch' || (needs.served.outputs.built == 'success' && needs.served.outputs.reached == 'yes'))
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    env:
      E2E_PARITY: "1"
      E2E_PARITY_CHECK: ${{ inputs.check || 'borrowed' }}
      E2E_BASE_URL: ${{ inputs.base_url || vars.WEB_ORIGIN || 'https://kalavigyan.vercel.app' }}
      E2E_VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      E2E_REPORT_DIR: parity-run
      E2E_WORKERS: "3"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm 12
        run: npm install --global npm@12 && npm --version

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Compare at 360, 834, 1440 and 1920 in light and dark
        run: npx playwright test --project='parity-*'

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: monograph-parity-${{ github.run_id }}
          path: frontend/parity-run
          if-no-files-found: warn
          retention-days: 30
