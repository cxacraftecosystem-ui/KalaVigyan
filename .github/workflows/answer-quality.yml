name: Answer quality

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Ask at most this many questions (empty for all)"
        type: string
        default: ""
      only:
        description: "Ask only these question ids, separated by spaces (empty for all)"
        type: string
        default: ""
      cap:
        description: "Spend at most this many US dollars; never above the cap in services/coverage_eval.py"
        type: string
        default: ""
      fresh:
        description: "Answer each question afresh, reusing no stored section (to compare routes on equal terms)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: answer-quality
  cancel-in-progress: false

jobs:
  evaluate:
    name: Ask the evaluation questions and score each answer
    if: github.repository == 'cxacraftecosystem-ui/KalaVigyan'
    runs-on: ubuntu-26.04
    timeout-minutes: 260
    outputs:
      outcome: ${{ steps.floors.outputs.outcome }}
      measures: ${{ steps.floors.outputs.measures }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      BUCKET: ${{ vars.MEDIA_BUCKET }}
      LIMIT: ${{ inputs.limit }}
      ONLY: ${{ inputs.only }}
      CAP: ${{ inputs.cap }}
      FRESH: ${{ inputs.fresh }}
    steps:
      - name: Check the repository variables and the inputs
        run: |
          set -euo pipefail
          for v in AWS_REGION INSTANCE_ID BUCKET; do
            [ -n "${!v}" ] || { echo "::error::repository variable for $v is not set (see docs/RUNBOOK.md)"; exit 1; }
          done
          [[ "$LIMIT" =~ ^[0-9]*$ ]] || { echo "::error::limit is a whole number"; exit 1; }
          [[ "$ONLY" =~ ^[a-z0-9\ -]*$ ]] || { echo "::error::only lists question ids separated by spaces"; exit 1; }
          [[ "$CAP" =~ ^([0-9]+(\.[0-9]+)?)?$ ]] || { echo "::error::cap is a number of US dollars"; exit 1; }
          args=""
          [ -z "$LIMIT" ] || args="$args --limit $LIMIT"
          [ -z "$ONLY" ] || args="$args --only $ONLY"
          [ -z "$CAP" ] || args="$args --cap $CAP"
          [ "$FRESH" != "true" ] || args="$args --fresh"
          echo "EVAL_ARGS=$args" >> "$GITHUB_ENV"

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: answer-quality-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Ask the evaluation questions, score each answer against the rubric and the judge, and keep the report
        run: |
          set -euo pipefail
          script=$(cat <<EOF
          set -euo pipefail
          cd /opt/kalavigyan/current/backend
          runuser -u kalavigyan -- bash -c "set -a; . /opt/kalavigyan/.env; [ ! -f ../release.env ] || . ../release.env; set +a; exec ./.venv/bin/python -m app.scripts.eval_answers $EVAL_ARGS"
          EOF
          )
          prefix="deploy/logs/answer-quality/$GITHUB_RUN_ID"
          jq -n --arg s "$script" '{commands: [$s], executionTimeout: ["14400"]}' > "$RUNNER_TEMP/params.json"
          cid="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "answer quality run ${GITHUB_RUN_ID}" \
            --timeout-seconds 300 \
            --parameters "file://$RUNNER_TEMP/params.json" \
            --output-s3-bucket-name "$BUCKET" \
            --output-s3-key-prefix "$prefix" \
            --query Command.CommandId --output text)"
          echo "SSM command $cid"
          deadline=$(( $(date +%s) + 14700 ))
          while :; do
            sleep 30
            status="$(aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)"
            case "$status" in
              Pending|InProgress|Delayed) ;;
              *) break ;;
            esac
            [ "$(date +%s)" -lt "$deadline" ] || { echo "::error::the answer evaluation did not finish in 245 minutes"; status=TimedOut; break; }
          done
          echo "status: $status"
          base="$prefix/$cid/$INSTANCE_ID/awsrunShellScript/0.awsrunShellScript"
          mkdir -p "$RUNNER_TEMP/answer-quality"
          aws s3 cp --only-show-errors "s3://$BUCKET/$base/stdout" "$RUNNER_TEMP/answer-quality/stdout.txt" || true
          echo "::group::box stderr"
          aws s3 cp --only-show-errors "s3://$BUCKET/$base/stderr" - 2>/dev/null || true
          echo "::endgroup::"
          if [ -s "$RUNNER_TEMP/answer-quality/stdout.txt" ]; then
            tail -n 1 "$RUNNER_TEMP/answer-quality/stdout.txt" | jq . > "$RUNNER_TEMP/answer-quality/report.json"
            jq '{askedQuestions: .asked, answered, rubricMean, judgeMean, spentUsd, capUsd, stopped}' "$RUNNER_TEMP/answer-quality/report.json"
            echo "### Answer quality" >> "$GITHUB_STEP_SUMMARY"
            jq -r '"Asked \(.asked), answered \(.answered), rubric \(.rubricMean), judge \(.judgeMean), spent $\(.spentUsd) of $\(.capUsd)"' "$RUNNER_TEMP/answer-quality/report.json" >> "$GITHUB_STEP_SUMMARY"
          fi
          [ "$status" = Success ] || { echo "::error::the answer evaluation ended $status; the report, when written, is kept as the answer-quality artifact (docs/contracts/answer-eval.md)"; exit 1; }

      - name: Compare with the floors
        id: floors
        if: always()
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/answer-quality/report.json"
          if [ ! -s "$report" ] || ! jq -e '.floorsApplied == true' "$report" > /dev/null; then
            outcome=unknown
            measures="the run did not ask every question to the end, so the floors were not compared"
          else
            measures="$(jq -r '[.floors[] | "\(.measure) \(.value // "none") (floor \(.floor))"] | join(", ")' "$report")"
            if jq -e '.belowFloor == true' "$report" > /dev/null; then outcome=failing; else outcome=passing; fi
          fi
          echo "Floors: $measures" >> "$GITHUB_STEP_SUMMARY"
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          echo "measures=$measures" >> "$GITHUB_OUTPUT"
          echo "answer floors: $outcome ($measures)"

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: answer-quality-${{ github.run_id }}
          path: ${{ runner.temp }}/answer-quality/
          if-no-files-found: warn
          retention-days: 90

      - name: Stop when a floor is broken
        if: steps.floors.outputs.outcome == 'failing'
        env:
          MEASURES: ${{ steps.floors.outputs.measures }}
        run: |
          echo "::error::answers fell below their floor: $MEASURES (backend/app/data/eval/floors.json)"
          exit 1

  alert:
    name: Open or close the answer floor issue
    needs: evaluate
    if: >-
      !cancelled() && github.repository == 'cxacraftecosystem-ui/KalaVigyan' &&
      (needs.evaluate.result == 'success' || needs.evaluate.result == 'failure')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the release issue action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions

      - name: Say what the evaluation found
        id: found
        env:
          OUTCOME: ${{ needs.evaluate.outputs.outcome }}
          MEASURES: ${{ needs.evaluate.outputs.measures }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/answer-floor.md"
          case "${OUTCOME:-unknown}" in
            failing) headline="Answers fell below their floor: ${MEASURES}." ;;
            passing) headline="Answers are at or above their floors again: ${MEASURES}." ;;
            *) headline="The answer evaluation did not ask every question to the end, so the floors were not compared." ;;
          esac
          printf '%s\n\nThe floors are in backend/app/data/eval/floors.json (decision 0126). Run: %s\n' "$headline" "$RUN_URL" > "$body"
          {
            echo "outcome=${OUTCOME:-unknown}"
            echo "body=$body"
          } >> "$GITHUB_OUTPUT"

      - name: Track the answer floor issue
        uses: ./.github/actions/release-issue
        with:
          title: Answers fell below their floor
          outcome: ${{ steps.found.outputs.outcome }}
          body-file: ${{ steps.found.outputs.body }}
