name: Post-deploy check

on:
  workflow_run:
    workflows: [Deploy web app, Deploy backend]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "47 * * * *"
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      commit:
        description: A commit of main production must serve within 40 minutes (empty checks that production is not behind main)
        type: string
        default: ""
      base_url:
        description: A Vercel preview of this project to read and operate instead of production (https://kalavigyan-<id>-cxacraftecosystem-8028s-projects.vercel.app); a preview run skips the commit check and the production issues
        type: string
        default: ""
  pull_request:
    paths:
      - ".github/workflows/post-deploy.yml"
      - ".github/actions/release-issue/**"
      - "frontend/e2e/release/**"
      - "frontend/app/api/version/**"
      - ".github/actions/await-build/**"

permissions:
  contents: read

concurrency:
  group: post-deploy-${{ github.event_name == 'pull_request' && github.ref || inputs.base_url && 'preview' || 'main' }}
  cancel-in-progress: false

env:
  WEB_ORIGIN: ${{ vars.WEB_ORIGIN || 'https://kalavigyan.vercel.app' }}

jobs:
  served:
    name: Production serves the pushed commit
    if: github.repository == 'cxacraftecosystem-ui/KalaVigyan' && github.event_name != 'pull_request' && !inputs.base_url
    runs-on: ubuntu-26.04
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ steps.want.outputs.mode }}
      expected: ${{ steps.want.outputs.expected }}
      trigger: ${{ steps.want.outputs.trigger }}
      verdict: ${{ steps.verdict.outputs.verdict }}
      served: ${{ steps.await.outputs.served }}
    steps:
      - name: Check out the repository with its history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Name the commit production must serve
        id: want
        env:
          EVENT: ${{ github.event_name }}
          TRIGGER_RUN: ${{ github.event.workflow_run.id }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_NAME: ${{ github.event.workflow_run.name }}
          TRIGGER_URL: ${{ github.event.workflow_run.html_url }}
          ASKED: ${{ inputs.commit }}
          WAIT_SECONDS: "2400"
        run: |
          set -euo pipefail
          mode=latest
          expected=""
          trigger=""
          run=""
          wait=0
          if [ "$EVENT" = workflow_run ]; then
            mode=deploy
            trigger="[$TRIGGER_NAME]($TRIGGER_URL)"
            run="$TRIGGER_RUN"
            expected="$TRIGGER_SHA"
            wait="$WAIT_SECONDS"
          elif [ -n "$ASKED" ]; then
            [[ "$ASKED" =~ ^[0-9a-f]{7,40}$ ]] || { echo "::error::commit must be a hexadecimal commit id"; exit 1; }
            expected="$(git rev-parse --verify --quiet "$ASKED^{commit}")" || { echo "::error::$ASKED is not a commit of this repository"; exit 1; }
            git merge-base --is-ancestor "$expected" origin/main || { echo "::error::$ASKED is not on main"; exit 1; }
            mode=asked
            wait="$WAIT_SECONDS"
          fi
          if [ "$mode" = latest ]; then
            command -v yq > /dev/null || { echo "::error::yq is not on the runner; cannot read the deploy workflows' push paths"; exit 1; }
            specs=()
            for workflow in deploy-web backend-checks; do
              mapfile -t globs < <(yq -r '.on.push.paths[]' ".github/workflows/$workflow.yml")
              [ "${#globs[@]}" -gt 0 ] || { echo "::error::$workflow.yml lists no push paths"; exit 1; }
              for glob in "${globs[@]}"; do specs+=(":(glob)$glob"); done
            done
            expected="$(git log -1 --format=%H origin/main -- "${specs[@]}")"
            [ -n "$expected" ] || { echo "::error::no commit of main touches what the deploys build"; exit 1; }
          fi
          {
            echo "mode=$mode"
            echo "expected=$expected"
            echo "trigger=$trigger"
            echo "run=$run"
            echo "wait=$wait"
          } >> "$GITHUB_OUTPUT"
          echo "mode $mode; production must serve ${expected:-no particular commit}"

      - name: Wait for the build of that commit
        id: await
        uses: ./.github/actions/await-build
        with:
          commit: ${{ steps.want.outputs.expected }}
          trigger-run: ${{ steps.want.outputs.run }}
          web-origin: ${{ env.WEB_ORIGIN }}
          wait-seconds: ${{ steps.want.outputs.wait }}
          token: ${{ github.token }}

      - name: Say whether production serves it
        id: verdict
        env:
          MODE: ${{ steps.want.outputs.mode }}
          EXPECTED: ${{ steps.want.outputs.expected }}
          BUILT: ${{ steps.await.outputs.built }}
          REACHED: ${{ steps.await.outputs.reached }}
          HAVE: ${{ steps.await.outputs.served }}
          WAITED: ${{ steps.await.outputs.waited }}
          GRACE_SECONDS: "5400"
        run: |
          set -euo pipefail
          case "$MODE:$BUILT" in
            deploy:none) verdict=no-build ;;
            deploy:failure) verdict=refused ;;
            deploy:success|asked:success) if [ "$REACHED" = yes ]; then verdict=served; else verdict=behind; fi ;;
            latest:success)
              age=$(( $(date +%s) - $(git log -1 --format=%ct "$EXPECTED") ))
              if [ -z "$HAVE" ]; then verdict=silent
              elif [ "$REACHED" = yes ]; then verdict=served
              elif [ "$age" -lt "$GRACE_SECONDS" ]; then verdict=building
              else verdict=behind
              fi
              ;;
            *) echo "::error::unknown mode $MODE with build $BUILT"; exit 1 ;;
          esac
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          unread=""
          [ "$MODE" = latest ] || unread=", so the pages were not read against an older build"
          {
            echo "### Production commit"
            echo ""
            echo "Production serves \`${HAVE:-no commit}\`; it should serve \`${EXPECTED:-any commit}\` or a later commit of main. Verdict: $verdict (waited ${WAITED:-0}s)."
          } >> "$GITHUB_STEP_SUMMARY"
          case "$verdict" in
            served) echo "production serves $HAVE" ;;
            no-build) echo "::notice::this deploy started no web build; production serves ${HAVE:-no commit}, so the pages are not read" ;;
            building) echo "::notice::the newest deployable commit ${EXPECTED:0:12} is younger than $(( GRACE_SECONDS / 60 )) minutes; its build may still be running" ;;
            behind) echo "::error::production still serves ${HAVE:-no commit}, not ${EXPECTED:0:12} or a later commit of main, after waiting ${WAITED:-0}s: its Vercel build failed or never finished$unread"; exit 1 ;;
            silent) echo "::error::$WEB_ORIGIN/api/version reports no commit"; exit 1 ;;
            refused) echo "::error::the deploy hook did not start the build of ${EXPECTED:0:12}$unread"; exit 1 ;;
          esac

  pages:
    name: Key pages and the public MCP tools answer
    needs: served
    if: >-
      !cancelled() && github.repository == 'cxacraftecosystem-ui/KalaVigyan' &&
      (github.event_name != 'schedule' || github.event.schedule == '17 3 * * *') &&
      (needs.served.result == 'skipped' || needs.served.outputs.mode == 'latest' || needs.served.outputs.verdict == 'served')
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      E2E_BASE_URL: ${{ inputs.base_url || vars.WEB_ORIGIN || 'https://kalavigyan.vercel.app' }}
      E2E_API_URL: ${{ vars.API_BASE_URL }}
      E2E_REPORT_DIR: post-deploy-run
      E2E_REPORT_TITLE: Post-deploy check
      E2E_WORKERS: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm 12
        run: npm install --global npm@12 && npm --version

      - name: Install
        run: npm ci

      - name: Check the repository variables
        run: |
          set -euo pipefail
          [ -n "$E2E_API_URL" ] || { echo "::error::repository variable API_BASE_URL is not set (docs/RUNBOOK.md)"; exit 1; }

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Read the key pages, operate every control and call the public MCP tools
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_VERCEL_BYPASS: ${{ inputs.base_url && secrets.VERCEL_AUTOMATION_BYPASS_SECRET || '' }}
          E2E_SIGN_IN_PROBE: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Deploy backend' && '1' || '' }}
        run: npx playwright test -c e2e/release/release.config.ts --project=post-deploy

      - name: Say what was read
        if: always()
        run: |
          if [ -f post-deploy-run/summary.md ]; then
            cat post-deploy-run/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No post-deploy summary was written; see the step above." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: post-deploy-${{ github.run_id }}
          path: frontend/post-deploy-run
          if-no-files-found: warn
          retention-days: 30

  alert:
    name: Open or close the production issues
    needs: [served, pages]
    if: >-
      !cancelled() && github.repository == 'cxacraftecosystem-ui/KalaVigyan' && github.event_name != 'pull_request' && !inputs.base_url
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check out the release issue action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions

      - name: Fetch the page report
        if: needs.pages.result == 'success' || needs.pages.result == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: post-deploy-${{ github.run_id }}
          path: ${{ runner.temp }}/post-deploy-run

      - name: Say what the checks found
        id: found
        env:
          SERVED_RESULT: ${{ needs.served.result }}
          PAGES_RESULT: ${{ needs.pages.result }}
          VERDICT: ${{ needs.served.outputs.verdict }}
          EXPECTED: ${{ needs.served.outputs.expected }}
          SERVED: ${{ needs.served.outputs.served }}
          TRIGGER: ${{ needs.served.outputs.trigger }}
        run: |
          set -euo pipefail
          commit_md="$RUNNER_TEMP/commit.md"
          pages_md="$RUNNER_TEMP/pages.md"
          case "$SERVED_RESULT:$VERDICT" in
            success:served) commit=passing ;;
            failure:*) commit=failing ;;
            *) commit=unchanged ;;
          esac
          case "$VERDICT" in
            behind) why="Production still serves \`${SERVED:-no commit}\` after waiting: the Vercel production build of \`$EXPECTED\` failed or never started." ;;
            silent) why="$WEB_ORIGIN/api/version reports no commit, so nobody can tell what production serves." ;;
            refused) why="The deploy hook did not start the production build of \`$EXPECTED\`." ;;
            served) why="Production serves \`$SERVED\`, which is \`$EXPECTED\` or a later commit of main." ;;
            *) why="The commit check itself failed before it could read production." ;;
          esac
          {
            echo "$why"
            echo ""
            echo "- Commit production should serve: \`${EXPECTED:-unknown}\`"
            echo "- Commit production serves: \`${SERVED:-none}\`"
            [ -z "$TRIGGER" ] || echo "- After: $TRIGGER"
            echo "- Check: $RUN_URL"
          } > "$commit_md"
          case "$PAGES_RESULT" in
            success) pages=passing ;;
            failure) pages=failing ;;
            *) pages=unchanged ;;
          esac
          report="$RUNNER_TEMP/post-deploy-run/summary.md"
          {
            if [ "$pages" = failing ]; then echo "A key page or a public MCP tool failed after production served \`${SERVED:-an unknown commit}\`."; else echo "Every key page and public MCP tool answered on production \`${SERVED:-an unknown commit}\`."; fi
            echo ""
            echo "Check: $RUN_URL"
            echo ""
            if [ "$pages" = failing ] && [ -f "$report" ]; then grep -E '^\| Check|^\|---|failed:' "$report" || true; fi
          } > "$pages_md"
          {
            echo "commit=$commit"
            echo "pages=$pages"
            echo "commit_md=$commit_md"
            echo "pages_md=$pages_md"
          } >> "$GITHUB_OUTPUT"

      - name: Track the commit issue
        uses: ./.github/actions/release-issue
        with:
          title: Production is not serving main
          outcome: ${{ steps.found.outputs.commit }}
          body-file: ${{ steps.found.outputs.commit_md }}

      - name: Track the page issue
        uses: ./.github/actions/release-issue
        with:
          title: Production pages or MCP tools are failing
          outcome: ${{ steps.found.outputs.pages }}
          body-file: ${{ steps.found.outputs.pages_md }}

  client:
    name: Run the MCP client against the new production
    needs: [served, pages]
    if: >-
      !cancelled() && github.event_name == 'workflow_run' && needs.served.outputs.verdict == 'served'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch MCP client on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run mcp-client.yml -R "$GITHUB_REPOSITORY" --ref main
