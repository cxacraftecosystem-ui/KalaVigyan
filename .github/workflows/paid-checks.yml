name: Paid voice and media checks

on:
  workflow_dispatch:
    inputs:
      cap:
        description: "Spend at most this many US dollars (the owner approved at most 5 on 2026-11-22)"
        type: string
        default: "5"

permissions:
  contents: read
  id-token: write

concurrency:
  group: paid-checks
  cancel-in-progress: false

jobs:
  check:
    name: Make one English and one Hindi narration, a music bed, a Gemini image and an agent turn on the box and keep each reply
    if: github.repository == 'cxacraftecosystem-ui/KalaVigyan'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      BUCKET: ${{ vars.MEDIA_BUCKET }}
      CAP: ${{ inputs.cap }}
    steps:
      - name: Check the repository variables and the cap
        run: |
          set -euo pipefail
          for v in AWS_REGION INSTANCE_ID BUCKET; do
            [ -n "${!v}" ] || { echo "::error::repository variable for $v is not set (see docs/RUNBOOK.md)"; exit 1; }
          done
          [[ "$CAP" =~ ^[0-9]+(\.[0-9]+)?$ ]] || { echo "::error::cap is a number of US dollars"; exit 1; }
          awk -v cap="$CAP" 'BEGIN { exit !(cap > 0 && cap <= 5) }' || { echo "::error::the owner approved at most US\$5"; exit 1; }

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: paid-checks-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run the checks on the box and fetch the recorded replies
        run: |
          set -euo pipefail
          dir="/var/tmp/kv-paid-checks/$GITHUB_RUN_ID"
          files="s3://$BUCKET/deploy/logs/paid-checks/$GITHUB_RUN_ID/files"
          script=$(cat <<EOF
          set -euo pipefail
          rm -rf $dir
          install -d -o kalavigyan -m 0750 $dir
          cd /opt/kalavigyan/current/backend
          status=0
          runuser -u kalavigyan -- bash -c "set -a; . /opt/kalavigyan/.env; set +a; exec ./.venv/bin/python -m app.scripts.paid_checks --cap $CAP --out $dir" || status=\$?
          aws s3 cp --only-show-errors --recursive --region $AWS_REGION $dir $files
          rm -rf $dir
          exit \$status
          EOF
          )
          prefix="deploy/logs/paid-checks/$GITHUB_RUN_ID"
          jq -n --arg s "$script" '{commands: [$s], executionTimeout: ["1500"]}' > "$RUNNER_TEMP/params.json"
          cid="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "paid checks run ${GITHUB_RUN_ID}" \
            --timeout-seconds 300 \
            --parameters "file://$RUNNER_TEMP/params.json" \
            --output-s3-bucket-name "$BUCKET" \
            --output-s3-key-prefix "$prefix" \
            --query Command.CommandId --output text)"
          echo "SSM command $cid"
          deadline=$(( $(date +%s) + 1560 ))
          while :; do
            sleep 15
            status="$(aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)"
            case "$status" in
              Pending|InProgress|Delayed) ;;
              *) break ;;
            esac
            [ "$(date +%s)" -lt "$deadline" ] || { echo "::error::the paid checks did not finish in 26 minutes"; status=TimedOut; break; }
          done
          echo "status: $status"
          out="$RUNNER_TEMP/paid-checks"
          mkdir -p "$out"
          aws s3 cp --only-show-errors --recursive "$files" "$out" 2>/dev/null || echo "::warning::the box wrote no recorded reply"
          if [ -s "$out/paid_checks_report.json" ]; then
            jq . "$out/paid_checks_report.json"
            {
              echo "### Paid voice and media checks"
              echo ""
              jq -r '"Spent $\(.spentUsd) of $\(.capUsd)"' "$out/paid_checks_report.json"
              echo ""
              echo "| Check | Counted US\$ | Result |"
              echo "|---|---|---|"
              jq -r '.spend[] as $row | "| \($row.check) | \($row.countedUsd // "skipped") | \(if $row.skipped then "skipped by the cap" else "made" end) |"' "$out/paid_checks_report.json"
              echo ""
              echo "Commit the artifact's replies as the fixtures docs/TECH_DEBT.md names (backend/tests/voice/fixtures and backend/tests/media/fixtures)."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::the box wrote no report"
          fi
          [ "$status" = Success ] || { echo "::error::the paid checks ended $status; what was recorded is kept as the paid-checks artifact"; exit 1; }

      - name: Keep the recorded replies
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paid-checks-${{ github.run_id }}
          path: ${{ runner.temp }}/paid-checks/
          if-no-files-found: warn
          retention-days: 90
