name: Geo ETL

on:
  pull_request:
    paths:
      - "etl/geo/**"
      - "backend/app/data/datasets/registry.json"
      - "backend/app/geo/region_rules.json"
      - "backend/migrations/versions/0005_region_profile.py"
      - "shared/region.state-values.sql"
      - "shared/river.topology.golden.json"
      - "shared/naming-golden.json"
      - ".github/workflows/geo-etl.yml"
  workflow_dispatch:
    inputs:
      datasets:
        description: "Layers, comma separated: soilgrids,worldcover,hansen,chelsa,chirps,ghcncams,groundwater,copdem,hydrorivers,mrds,glim,riverlines or all (ghcncams, groundwater, the vector layers and riverlines ignore shards; riverlines ignores states)"
        type: string
        default: all
      states:
        description: "State LGD codes, comma separated, or all"
        type: string
        default: all
      shards:
        description: "Shards per raster layer, 1 to 24, balanced by state area; capped at the number of states chosen"
        type: number
        default: 6
      load:
        description: "Upsert the combined tables into the database"
        type: boolean
        default: false
      prune:
        description: "With load: delete each loaded district's older rows of the datasets loaded (a re-run over a new period)"
        type: boolean
        default: false
      allow_failures:
        description: "Keep a part whose failures are scattered districts; a lost state, a silent district or a district without valid cells outside the reviewed list still fails"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: geo-etl-${{ github.event_name == 'pull_request' && github.ref || 'run' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.14"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
  GDAL_HTTP_MAX_RETRY: "6"
  GDAL_HTTP_RETRY_DELAY: "5"
  GDAL_HTTP_TIMEOUT: "120"
  CPL_VSIL_CURL_CACHE_SIZE: "200000000"

jobs:
  test:
    name: Test the geo ETL
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: etl/geo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: etl/geo/pyproject.toml
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e . pytest ruff
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests
        run: python -m pytest -q tests

  plan:
    name: Plan the extract matrix
    needs: test
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      rivers: ${{ steps.plan.outputs.rivers }}
      chirps_last_year: ${{ steps.chirps.outputs.last_year }}
    steps:
      - id: plan
        env:
          DATASETS: ${{ inputs.datasets }}
          SHARDS: ${{ inputs.shards }}
          STATES: ${{ inputs.states }}
        shell: python
        run: |
          import json
          import os
          import sys

          raster = ["soilgrids", "worldcover", "hansen", "chelsa", "chirps", "copdem"]
          vector = ["hydrorivers", "mrds", "glim"]
          whole = ["ghcncams", "groundwater"]
          lines = ["riverlines"]
          known = raster + vector + whole + lines
          text = os.environ["DATASETS"].replace(" ", "").lower()
          chosen = known if text in ("", "all") else [v for v in text.split(",") if v]
          unknown = sorted(set(chosen) - set(known))
          if unknown:
              sys.exit(f"unknown datasets: {', '.join(unknown)}; expected {', '.join(known)} or all")
          shards = int(float(os.environ["SHARDS"] or "1"))
          if not 1 <= shards <= 24:
              sys.exit(f"shards must be 1 to 24, got {shards}")
          states = os.environ["STATES"].replace(" ", "").lower()
          if states not in ("", "all"):
              shards = min(shards, len({v for v in states.split(",") if v}))
          include = []
          for layer in [k for k in raster + vector + whole if k in chosen]:
              if layer in raster and shards > 1:
                  include += [{"layer": layer, "shard": f"{i}/{shards}", "part": f"{layer}-shard{i}of{shards}"} for i in range(1, shards + 1)]
              else:
                  include.append({"layer": layer, "shard": "", "part": layer})
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"matrix={json.dumps({'include': include})}\n")
              out.write(f"count={len(include)}\n")
              out.write(f"rivers={'true' if 'riverlines' in chosen else 'false'}\n")
              out.write(f"chirps={'true' if 'chirps' in chosen else 'false'}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"{len(include)} extract jobs: {', '.join(i['part'] for i in include)}\n")
              if "riverlines" in chosen:
                  summary.write("River lines and basin topologies: one job\n")
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.plan.outputs.chirps == 'true' }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: ${{ steps.plan.outputs.chirps == 'true' }}
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: etl/geo/pyproject.toml
      - name: Install
        if: ${{ steps.plan.outputs.chirps == 'true' }}
        working-directory: etl/geo
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Resolve the CHIRPS last year once for every shard
        id: chirps
        if: ${{ steps.plan.outputs.chirps == 'true' }}
        working-directory: etl/geo
        run: |
          year=$(python -m geo_etl chirps-last-year)
          if ! [[ "$year" =~ ^[0-9]{4}$ ]]; then echo "::error::chirps-last-year printed '$year', not a year"; exit 1; fi
          echo "last_year=$year" >> "$GITHUB_OUTPUT"
          echo "CHIRPS last year, the same for every shard: $year" >> "$GITHUB_STEP_SUMMARY"

  extract:
    name: Extract ${{ matrix.part }}
    needs: plan
    if: ${{ needs.plan.outputs.count != '0' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        working-directory: etl/geo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: etl/geo/pyproject.toml
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Restore the download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/kalavigyan-geo
          key: kalavigyan-geo-${{ matrix.part }}-${{ hashFiles('etl/geo/geo_etl/catalog.py') }}-${{ github.run_id }}
          restore-keys: |
            kalavigyan-geo-${{ matrix.part }}-${{ hashFiles('etl/geo/geo_etl/catalog.py') }}-
            kalavigyan-geo-${{ matrix.part }}-
      - name: Extract
        env:
          LAYER: ${{ matrix.layer }}
          SHARD: ${{ matrix.shard }}
          STATES: ${{ inputs.states }}
          ALLOW_FAILURES: ${{ inputs.allow_failures }}
          CHIRPS_LAST_YEAR: ${{ needs.plan.outputs.chirps_last_year }}
          DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
        run: |
          args=(extract --datasets "$LAYER" --states "${STATES:-all}" --parts out/parts --cache "$HOME/.cache/kalavigyan-geo")
          if [ -n "$SHARD" ]; then args+=(--shard "$SHARD"); fi
          if [ "$LAYER" = "chirps" ]; then args+=(--chirps-last-year "$CHIRPS_LAST_YEAR"); fi
          if [ "$ALLOW_FAILURES" = "true" ]; then args+=(--allow-failures); fi
          python -m geo_etl "${args[@]}"
      - name: Upload the part
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: geo-part-${{ matrix.part }}
          path: etl/geo/out/parts/
          if-no-files-found: error
          retention-days: 7

  combine:
    name: Combine parts
    needs: [plan, extract]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: etl/geo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: etl/geo/pyproject.toml
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Download the parts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: geo-part-*
          path: etl/geo/out/parts
          merge-multiple: true
      - name: Combine
        env:
          EXPECTED: ${{ needs.plan.outputs.count }}
        run: |
          found=$(find out/parts -maxdepth 1 -name '*.json' | wc -l)
          echo "parts: $found of $EXPECTED"
          python -m geo_etl combine --parts out/parts --out out
      - name: Validate for loading
        run: python load.py --out out --dry-run
      - name: Summary
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          s = json.load(open("out/district_env_summary.json", encoding="utf-8"))
          print(f"{s['rows']} values over {s['districts']} districts, {s['geologyRows']} geology rows")
          print()
          print("| layer | shard | rows | failures | districts without values | of which without valid cells | of those not reviewed | silent districts | seconds |")
          print("|---|---|---|---|---|---|---|---|---|")
          for layer in s["layers"]:
              print(f"| {layer['layer']} | {layer['shard'] or ''} | {layer['rows']} | {layer['failureCount']} | {len(layer['districtsWithoutValues'])} | {len(layer['districtsWithoutCells'])} | {len(layer['unexpectedWithoutCells'])} | {len(layer['silentDistricts'])} | {layer['seconds']} |")
          EOF
      - name: Upload the outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: geo-district-env
          path: |
            etl/geo/out/district_env.parquet
            etl/geo/out/district_geology.parquet
            etl/geo/out/district_env_summary.json
            etl/geo/out/KalaVigyan_Dataset_*_District-Stats.csv
          if-no-files-found: error
          retention-days: 90

  load:
    name: Load into the database
    needs: combine
    if: ${{ inputs.load }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: etl/geo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: etl/geo/pyproject.toml
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Download the outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: geo-district-env
          path: etl/geo/out
      - name: Upsert
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PRUNE: ${{ inputs.prune }}
        run: |
          args=(--out out)
          if [ "$PRUNE" = "true" ]; then args+=(--prune); fi
          python load.py "${args[@]}"

  rivers:
    name: River lines and basin topologies
    needs: plan
    if: ${{ needs.plan.outputs.rivers == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: etl/geo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: etl/geo/pyproject.toml
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Restore the download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/kalavigyan-geo
          key: kalavigyan-geo-riverlines-${{ hashFiles('etl/geo/geo_etl/catalog.py') }}-${{ github.run_id }}
          restore-keys: |
            kalavigyan-geo-riverlines-${{ hashFiles('etl/geo/geo_etl/catalog.py') }}-
            kalavigyan-geo-riverlines-
      - name: Build
        run: python -m geo_etl rivers --out out/rivers --cache "$HOME/.cache/kalavigyan-geo"
      - name: Install osmium
        run: sudo apt-get update && sudo apt-get install -y osmium-tool
      - name: Name the rivers
        run: python -m geo_etl river-names --rivers out/rivers --scratch "$RUNNER_TEMP/osm"
      - name: Validate for loading
        run: python load_rivers.py --out out/rivers --dry-run
      - name: Summary
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          m = json.load(open("out/rivers/river_basins.json", encoding="utf-8"))
          n = json.load(open("out/rivers/river_names_summary.json", encoding="utf-8"))
          sizes = sorted(b["bytes"] for b in m["basins"])
          print(f"{m['reaches']} reaches with upstream area >= {m['uplandMinSkm']} km2 in {len(sizes)} basins")
          print(f"{m['reachDistricts']} reach districts")
          print(f"largest topology {sizes[-1]} bytes, median {sizes[len(sizes) // 2]} bytes")
          print()
          print(f"{n['wikidataRivers']} rivers named from Wikidata over {n['wikidataReaches']} reaches, of {n['wikidataItems']} items")
          print(f"{n['osmRivers']} rivers named from OpenStreetMap over {n['osmReaches']} reaches, from {n['osmWays']} ways")
          print(f"Wikidata items refused: {n['wikidataRefused']}")
          EOF
      - name: Upload the outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: geo-river-lines
          path: etl/geo/out/rivers/
          if-no-files-found: error
          retention-days: 90

  load-rivers:
    name: Load river lines
    needs: rivers
    if: ${{ inputs.load }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      RIVER_LOAD_ROLE_ARN: ${{ vars.AWS_RIVER_LOAD_ROLE_ARN }}
      S3_BUCKET: ${{ vars.MEDIA_BUCKET }}
    defaults:
      run:
        working-directory: etl/geo
    steps:
      - name: Check the repository variables
        working-directory: .
        run: |
          set -euo pipefail
          for v in AWS_REGION RIVER_LOAD_ROLE_ARN S3_BUCKET; do
            [ -n "${!v}" ] || { echo "::error::repository variable for $v is not set (see docs/RUNBOOK.md)"; exit 1; }
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: etl/geo/pyproject.toml
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Download the outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: geo-river-lines
          path: etl/geo/out/rivers
      - name: Assume the river load role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_RIVER_LOAD_ROLE_ARN }}
          role-session-name: geo-etl-rivers-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Upload topologies and replace the river tables
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python load_rivers.py --out out/rivers
