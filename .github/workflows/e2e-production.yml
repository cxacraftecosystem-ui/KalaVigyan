name: E2E production

on:
  workflow_dispatch:
    inputs:
      questions:
        description: Also ask the nine known-answer questions (the mordant in English, Hindi and Urdu, Kachchh's water, what the cloth is made of, its history, its seasons and a Varanasi craft's Ganga at Detailed depth, indigo's generated explainer at Expert depth)
        type: boolean
        default: false
      base_url:
        description: A Vercel preview of this project to drive instead of production (https://kalavigyan-<id>-cxacraftecosystem-8028s-projects.vercel.app); empty drives production
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: e2e-production
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  production:
    name: Drive production at every width
    if: github.repository == 'cxacraftecosystem-ui/KalaVigyan'
    runs-on: ubuntu-26.04
    timeout-minutes: 130
    defaults:
      run:
        working-directory: frontend
    env:
      E2E_PRODUCTION: "1"
      E2E_BASE_URL: ${{ inputs.base_url || vars.WEB_ORIGIN || 'https://kalavigyan.vercel.app' }}
      E2E_PREVIEW: ${{ inputs.base_url != '' && '1' || '0' }}
      E2E_QUESTIONS: ${{ inputs.questions && '1' || '0' }}
      E2E_REPORT_DIR: production-run
      E2E_RUN_ID: ${{ github.run_id }}
      E2E_WORKERS: "4"
      E2E_RETRIES: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm 12
        run: npm install --global npm@12 && npm --version

      - name: Install
        run: npm ci

      - name: Check the account secrets
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "$E2E_EMAIL" ] || missing="$missing E2E_EMAIL"
          [ -n "$E2E_PASSWORD" ] || missing="$missing E2E_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Set the repository secrets:$missing (docs/RUNBOOK.md, E2E production run)"
            exit 1
          fi
          if [ "$E2E_PREVIEW" = "1" ] && [ -z "$E2E_VERCEL_BYPASS" ]; then
            echo "::warning::VERCEL_AUTOMATION_BYPASS_SECRET is not set, so a protected preview answers 401 (docs/RUNBOOK.md, E2E production run)"
          fi
          if [ "$E2E_PREVIEW" = "1" ]; then
            echo "::notice::A preview run gets no Professor or Admin secret and skips their screens"
          fi
          echo "::add-mask::$E2E_PASSWORD"
          echo "E2E_RUN_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Install the browsers
        run: |
          set -euo pipefail
          if [ "$E2E_PREVIEW" = "1" ]; then
            npx playwright install --with-deps chromium webkit
          else
            npx playwright install --with-deps chromium
          fi

      - name: Drive production
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          E2E_PROFESSOR_EMAIL: ${{ inputs.base_url == '' && secrets.E2E_PROFESSOR_EMAIL || '' }}
          E2E_PROFESSOR_PASSWORD: ${{ inputs.base_url == '' && secrets.E2E_PROFESSOR_PASSWORD || '' }}
          E2E_PROFESSOR_TOTP_SECRET: ${{ inputs.base_url == '' && secrets.E2E_PROFESSOR_TOTP_SECRET || '' }}
          E2E_ADMIN_EMAIL: ${{ inputs.base_url == '' && secrets.E2E_ADMIN_EMAIL || '' }}
          E2E_ADMIN_PASSWORD: ${{ inputs.base_url == '' && secrets.E2E_ADMIN_PASSWORD || '' }}
          E2E_ADMIN_TOTP_SECRET: ${{ inputs.base_url == '' && secrets.E2E_ADMIN_TOTP_SECRET || '' }}
        run: npx playwright test --project='production-*'

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-production-screenshots-${{ github.run_id }}
          path: frontend/production-run/screens
          if-no-files-found: warn
          retention-days: 30

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-production-report-${{ github.run_id }}
          path: |
            frontend/production-run/*.json
            frontend/production-run/*.md
          if-no-files-found: warn
          retention-days: 30

      - name: Say when no report was written
        if: always()
        run: |
          if ! ls production-run/*.md > /dev/null 2>&1; then
            {
              echo "## E2E production"
              echo ""
              echo "No report was written. See the Drive production step."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
