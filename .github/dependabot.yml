version: 2

updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    versioning-strategy: increase
    open-pull-requests-limit: 10
    labels: []
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    versioning-strategy: increase
    open-pull-requests-limit: 10
    labels: []
    groups:
      uv-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directories:
      - /etl/crafts
      - /etl/geo
      - /tools
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    versioning-strategy: increase
    open-pull-requests-limit: 5
    labels: []
    groups:
      pip-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    labels: []
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
